# Builds the web version of the app and publishes it on GitHub Pages,
# so it opens on any phone at https://djomlaxp.github.io/VibeIN/
name: Web verzija

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages serves the site under /VibeIN/, not at the domain root.
      - run: jq '.expo.experiments.baseUrl = "/VibeIN"' app.json > app.tmp && mv app.tmp app.json
      - run: npx expo export --platform web
      # Lets iPhone/Android "Add to Home Screen" open VibeIN full screen with its own icon.
      - run: |
          sed -i 's#</head>#<link rel="manifest" href="/VibeIN/manifest.json"><link rel="apple-touch-icon" href="/VibeIN/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VibeIN"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="\#000000"></head>#' dist/index.html
          grep -q apple-touch-icon dist/index.html
      # Single-page app: let Pages hand every unknown path to the app's router.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
