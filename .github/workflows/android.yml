# Builds an Android app file (APK) and puts it on a fixed public download link,
# so it installs on a phone without the Play Store (Djomla's OK, 2026-10-17):
# https://github.com/djomlaxp/VibeIN/releases/download/android/vibein.apk
name: Android aplikacija

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build per branch: a pull request's build must not cancel the build of main.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release build, signed with the template's debug key so every new APK
      # installs over the previous one. arm64 only: covers today's phones.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk vibein.apk
      # Only main goes to the download link; pull requests just check that it builds.
      - name: Publish to the "android" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || \
            gh release create android --target main --title "VibeIN za Android" \
              --notes "Najnovija Android verzija. Skini vibein.apk na telefonu i instaliraj."
          gh release upload android vibein.apk --clobber
