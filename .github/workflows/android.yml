# Builds an Android app file (APK) on every change to main and keeps it as a
# download on the workflow run (visible to people with access to the repo).
name: Android aplikacija

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release build, signed with the template's debug key so every new APK
      # installs over the previous one. arm64 only: covers today's phones.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: vibein-apk
          path: android/app/build/outputs/apk/release/app-release.apk
