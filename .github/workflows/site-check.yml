# Opens the published web version in a phone-sized browser and fails if the
# app crashes or shows no venues.
name: Provera sajta

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Web verzija]
    types: [completed]
  push:
    paths: [scripts/check-site.mjs, .github/workflows/site-check.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/check-site.mjs
